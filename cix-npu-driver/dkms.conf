# Arch Linux ARM override of upstream driver/dkms.conf (cix_mainline_upstream_dev, tag p1_7.0_v6.2.0).
#
# Single intentional difference vs upstream: BUILD_NPU_DEVFREQ=n.
#
# Why: the Orion O6 SKY1 EDK2 firmware does not describe an SCMI device in its
# ACPI tables (the 22 PRP0001 nodes are DDR ctrl / ramoops / regulators / LEDs;
# /sys/bus/scmi_protocol/devices is empty on the stock ALARM kernel). The
# driver's devfreq init attaches an SCMI perf power domain and treats failure
# as fatal, so probe would never complete. With devfreq off the NPU cores run
# at the firmware default clock. Everything else (Zhouyi V3, SKY1 glue,
# ACPI HID CIXH4000 match) is upstream-identical.
PACKAGE_NAME="aipu"
PACKAGE_VERSION="6.2.0"
BUILT_MODULE_NAME[0]="aipu"
DEST_MODULE_LOCATION[0]="/updates"
MAKE[0]="make -C ${kernel_source_dir} M=${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build BUILD_AIPU_VERSION_KMD=BUILD_ZHOUYI_V3 BUILD_TARGET_PLATFORM_KMD=BUILD_PLATFORM_SKY1 BUILD_NPU_DEVFREQ=n COMPASS_DRV_BTENVAR_KMD_VERSION=${PACKAGE_VERSION}"

AUTOINSTALL="yes"
