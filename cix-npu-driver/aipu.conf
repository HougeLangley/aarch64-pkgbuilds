# Explicit boot-time load for the CIX Orion O6 NPU driver.
#
# aipu.ko also carries the modalias alias "acpi*:CIXH4000:*", so udev loads it
# on its own when the _SB_.NPU0 platform device is enumerated; this file makes
# the intent explicit and deterministic via systemd-modules-load. It lives in
# /usr/lib (package-owned) rather than /etc (admin override), matching the
# other module-loading packages on Arch. mkinitcpio's modconf hook does not
# copy /usr/lib/modules-load.d into the initramfs, so this does not cause an
# early-boot "module not found" attempt inside the initrd.
aipu
