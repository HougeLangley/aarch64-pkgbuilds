# Arch Linux ARM override of the fork's driver/dkms.conf (Reonarudo
# sky1-zhouyi-v3-driver, commit f91f8dd = tag v6.2.0-1+zv3.2, based on CIX 6.2.0-1).
#
# Differences vs the fork's own dkms.conf:
#   * PACKAGE_NAME="zhouyi-aipu" instead of "aipu": the tinygrad ZHOUYI backend
#     locates the driver UAPI header at
#     /usr/src/zhouyi-aipu-<version>/include/armchina_aipu.h, so the DKMS tree
#     is installed as /usr/src/zhouyi-aipu-<version>/ (the package also puts a
#     copy of the header at include/ inside that tree).
#   * PACKAGE_VERSION="#DKMVER#" is resolved by makepkg to ${pkgver}.r${_fork}
#     (6.2.0.rf91f8dd): CIX base version + fork commit.
#   * MAKE[0] passes BUILD_AIPU_VERSION_KMD / BUILD_TARGET_PLATFORM_KMD, kept
#     for parity with cix-npu-driver's dkms.conf; the fork's Makefile hardcodes
#     Zhouyi V3 + SKY1, so they are inert here.
#   * No CLEAN=: dkms 3.4.5 flags it as deprecated (the fork dropped it too
#     as of v6.2.0-1+zv3.2).
#
# devfreq / SCMI: the Orion O6 SKY1 EDK2 firmware does not describe an SCMI
# device in its ACPI tables by default (the 22 PRP0001 nodes are DDR ctrl /
# ramoops / regulators / LEDs; /sys/bus/scmi_protocol/devices is empty on the
# stock ALARM kernel). Since v6.2.0-1+zv3.2 the fork's devfreq is optional at
# runtime: with no SCMI perf domain probe logs "devfreq unavailable (<errno>),
# continuing without it" (-17 on the O6) and the NPU cores run at the firmware
# default clock.
# If BIOS setup -> Device Manager -> Platform Configuration -> Compliance
# Configuration -> "Enable ACPI SCMI" is switched on (the CIX PPA manual says
# kernel 7.0 needs it), the same module picks up devfreq/DVFS by itself; no
# rebuild or build switch is involved. Everything else (Zhouyi V3, SKY1 glue,
# ACPI HID CIXH4000 match, the fork's job-completion / interrupt-mask fixes and
# WBUF/SLOT zero-copy ioctls) is built exactly as in the fork.
PACKAGE_NAME="zhouyi-aipu"
PACKAGE_VERSION="#DKMVER#"
BUILT_MODULE_NAME[0]="aipu"
DEST_MODULE_LOCATION[0]="/updates"
MAKE[0]="make -C ${kernel_source_dir} M=${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build BUILD_AIPU_VERSION_KMD=BUILD_ZHOUYI_V3 BUILD_TARGET_PLATFORM_KMD=BUILD_PLATFORM_SKY1 COMPASS_DRV_BTENVAR_KMD_VERSION=${PACKAGE_VERSION}"

AUTOINSTALL="yes"
