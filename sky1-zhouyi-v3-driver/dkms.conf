# Arch Linux ARM override of the fork's driver/dkms.conf (Reonarudo
# sky1-zhouyi-v3-driver, commit 9edd06b, based on CIX 6.2.0-1).
#
# Differences vs the fork's own dkms.conf:
#   * PACKAGE_NAME="zhouyi-aipu" instead of "aipu": the tinygrad ZHOUYI backend
#     locates the driver UAPI header at
#     /usr/src/zhouyi-aipu-<version>/include/armchina_aipu.h, so the DKMS tree
#     is installed as /usr/src/zhouyi-aipu-<version>/ (the package also puts a
#     copy of the header at include/ inside that tree).
#   * PACKAGE_VERSION="#DKMVER#" is resolved by makepkg to ${pkgver}.r${_fork}
#     (6.2.0.r9edd06b): CIX base version + fork commit.
#   * MAKE[0] passes (see below). BUILD_AIPU_VERSION_KMD /
#     BUILD_TARGET_PLATFORM_KMD are kept for parity with cix-npu-driver's
#     dkms.conf; the fork's Makefile hardcodes Zhouyi V3 + SKY1, so they are
#     inert here.
#   * No CLEAN=: dkms 3.4.5 flags it as deprecated.
#
# Why: the fork enables devfreq unconditionally. The Orion
# O6 SKY1 EDK2 firmware does not describe an SCMI device in its ACPI tables
# (the 22 PRP0001 nodes are DDR ctrl / ramoops / regulators / LEDs;
# /sys/bus/scmi_protocol/devices is empty on the stock ALARM kernel). The
# driver's devfreq init attaches an SCMI perf power domain and treats failure
# as fatal, so probe would never complete. The package's patch
# 0001-sky1-make-devfreq-optional-BUILD_NPU_DEVFREQ.patch wraps the devfreq
# code in CONFIG_ENABLE_DEVFREQ, which the Makefile only defines when
# BUILD_NPU_DEVFREQ != n. With devfreq off the NPU cores run at the firmware
# default clock. Everything else (Zhouyi V3, SKY1 glue, ACPI HID CIXH4000
# match, the fork's job-completion / interrupt-mask fixes and WBUF/SLOT
# zero-copy ioctls) is built exactly as in the fork.
#
# Optional: the CIX PPA manual ("Open-Source Driver Edition") says kernel 7.0
# needs BIOS setup -> Device Manager -> Platform Configuration -> Compliance
# Configuration -> "Enable ACPI SCMI". With that option on, an SCMI device shows
# up and BUILD_NPU_DEVFREQ=y can be used to get devfreq/DVFS; this package
# keeps =n because the option is off by default on the O6.
PACKAGE_NAME="zhouyi-aipu"
PACKAGE_VERSION="#DKMVER#"
BUILT_MODULE_NAME[0]="aipu"
DEST_MODULE_LOCATION[0]="/updates"
MAKE[0]="make -C ${kernel_source_dir} M=${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build BUILD_AIPU_VERSION_KMD=BUILD_ZHOUYI_V3 BUILD_TARGET_PLATFORM_KMD=BUILD_PLATFORM_SKY1 COMPASS_DRV_BTENVAR_KMD_VERSION=${PACKAGE_VERSION}"

AUTOINSTALL="yes"
